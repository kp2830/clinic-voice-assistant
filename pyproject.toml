[project]
name = "clinic-voice-assistant"
version = "0.1.0"
description = "A clinic patient-support agent built with LangChain/LangGraph multi-agent handoffs (Option A: agents as graph nodes), served as both a text chat and a Pipecat voice bot, traced to LangSmith."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langsmith>=0.8.18",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pipecat-ai[openai,silero,tracing,webrtc]>=1.4.0",
    "pipecat-ai-prebuilt>=1.0.2",
]

[project.scripts]
clinic-voice-assistant = "clinic_support.server:main"
clinic-support-eval = "clinic_support.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_support"]
